[project]
name = "agentmesh"
version = "0.1.0"
description = "Multi-agent system over A2A: an orchestrator plus specialist agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.2.1,<2",
    "agentos",
    "cryptography>=50.0.2,<51",
    "ddgs==9.16.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0,<3",
    "trafilatura==2.3.0",
    "uvicorn>=0.35",
]

[project.scripts]
agentmesh = "agentmesh:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.uv.sources]
agentos = { git = "https://github.com/yqx1412/agentos", rev = "375e4b35ccd4d56a88b4cb78d9f0ca5c7053a7db" }
